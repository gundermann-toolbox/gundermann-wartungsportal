<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12355b">
<meta name="apple-mobile-web-app-title" content="Wartung">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Wartungsportal Lüftung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Fira+Sans+Condensed:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout im Stil der Gundermann-Webseite: weißer Kopf mit Logo, schräges dunkelblaues Navigationsband, Inhalt darunter.
   Techniker-Ansicht = schmale Handy-App in der Mitte. Farben aus dem Logo: Dunkelblau und Magenta. Bewusst immer hell. */
:root{
  --brand:#12355b; --mag:#e5007d;
  --bg:#f4f6f9; --surface:#ffffff; --sunk:#eaeef3; --ink:#0f2a47; --muted:#5a6b7d; --line:#d7dee6; --line-strong:#c2cdd8;
  --accent:#12355b; --accent-ink:#ffffff; --accent-soft:#e2e9f1;
  --signal:#e5007d; --signal-ink:#ffffff;
  --ok:#23784a; --ok-soft:#dcefe3; --warn:#9a6200; --warn-soft:#f8ead0; --bad:#b4332a; --bad-soft:#f6dcd9;
  --paper:#ffffff; --paper-ink:#1a1f24; --paper-line:#c9d0d5; --paper-muted:#5d6870; --paper-ok:#1f6e43; --paper-bad:#b02a20; --paper-sunk:#eef1f3;
  --paper-brand:#12355b; --paper-mag:#e5007d;
  --map-bg:#eef2f6; --map-grid:#dae1e9; --map-town:#7f8ea0;
  --shade:rgba(10,25,45,.45);
  --f-display:'Fira Sans Condensed','Arial Narrow',sans-serif;
  --f-body:'Fira Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'Fira Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{background:var(--surface)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;text-decoration:none;color:var(--brand)}
.brand{gap:16px;flex-wrap:wrap}
.brand .logo{height:60px;width:auto;max-width:100%;display:block}
.appname{font:500 15px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--brand);border-left:2px solid var(--line);padding-left:16px;white-space:nowrap}
.slash{color:var(--mag);font-weight:700;font-style:italic;margin-inline:.35em}
@media (max-width:620px){.brand .logo{height:42px}.appname{font-size:12px;border-left:0;padding-left:0;width:100%}}
.demo{font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mag);border:1px solid var(--mag);padding:2px 8px;border-radius:4px}
.band{background:var(--brand);clip-path:polygon(0 16px,26% 0,100% 20px,100% 100%,0 100%);padding-top:18px;margin-top:4px}
.band-in{max-width:1320px;margin:0 auto;min-height:52px;display:flex;align-items:center}
.bandlabel{color:#fff;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 0}
.menubtn{display:none;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;color:#fff;font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:14px 0;cursor:pointer}
.menubtn .ico{font-size:22px;line-height:1}
@media (max-width:900px){
  .band-in{flex-direction:column;align-items:stretch}
  .menubtn{display:flex}
  .band-in .nav{display:none;flex-direction:column;overflow:visible;padding-bottom:10px}
  .band.open .band-in .nav{display:flex}
  .band-in .nav button{border-bottom:1px solid rgba(255,255,255,.14);border-left:4px solid transparent;padding:13px 12px;justify-content:flex-start}
  .band-in .nav button .cnt{margin-left:auto}
  .band-in .nav button.on{border-bottom-color:rgba(255,255,255,.14);border-left-color:var(--mag);background:rgba(255,255,255,.06)}
  .band-in .nav .bandlabel{display:none}
  .top-in .demo, .top-in .modes, .top-in .who, .top-in .gsuche, .top-in #offline{display:none!important}
  .band.open .navextra{display:grid}
}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
/* Suche im Kopf */
.gsuche{position:relative;min-width:0}
.gsuche input{min-height:36px;padding:6px 10px 6px 32px;width:220px;max-width:100%;background:var(--bg)}
.gsuche .lupe{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.gres{position:absolute;left:0;top:calc(100% + 4px);width:min(420px,90vw);max-height:60vh;overflow:auto;background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 30px rgba(10,30,50,.18);z-index:40;padding:6px;display:grid;gap:2px}
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink)}
.gitem:hover,.gitem:focus-visible{background:var(--sunk)}
.gitem .art{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);grid-row:span 2}
.gitem b{font-weight:600}
.gitem small{color:var(--muted)}
/* Menü-Zusatz am Handy: Suche, Ansicht, Benutzer */
.navextra{display:none;gap:10px;padding:12px 0 6px;border-top:1px solid rgba(255,255,255,.2);margin-top:6px}
.navextra .gsuche input{width:100%}
.navextra .gres{width:100%}
.navextra .modes{width:100%;display:grid;grid-template-columns:1fr 1fr}
.navextra label{color:#fff;font-size:13px;display:grid;gap:4px}
.navextra select{min-height:40px}
.ico-i{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}
.nav button .ico-i{opacity:.85}
@media (min-width:901px) and (max-width:1180px){ .nav button .ico-i{display:none} }
button.kpi{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.pdf.ersetzt{opacity:.6}
.pdf.ersetzt b{text-decoration:line-through}
.wgrid-wrap{overflow-x:auto}
.wgrid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:760px}
.wgrid th,.wgrid td{border:1px solid var(--line);vertical-align:top;padding:6px;text-align:left}
.wgrid thead th{background:var(--sunk);font-size:13px}
.wgrid tbody th{width:130px;font-size:13px;background:var(--sunk)}
.wgrid .heute{background:rgba(229,0,125,.05)}
.wgrid thead th.heute{color:var(--mag)}
.wgrid td{height:84px}
.wgrid td.ziel{outline:2px dashed var(--accent);outline-offset:-3px;background:rgba(18,53,91,.06)}
.wjob{display:grid;gap:1px;width:100%;text-align:left;border:1px solid var(--line-strong);border-left:4px solid var(--brand);border-radius:6px;background:var(--surface);padding:5px 7px;margin-bottom:5px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.wjob[draggable=true]{cursor:grab}
.wjob .wo{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wjob .wz{font-size:11.5px;color:var(--muted)}
.wjob .wz b{color:var(--ink)}
.wjob.st-planung{border-left-color:var(--muted);border-style:dashed solid dashed solid}
.wjob.st-laeuft{border-left-color:var(--warn)}
.wjob.st-erledigt,.wjob.st-abgerechnet{border-left-color:var(--ok);opacity:.75}
.wplus{border:1px dashed var(--line-strong);background:none;border-radius:6px;width:100%;color:var(--muted);cursor:pointer;opacity:0;font-size:16px;line-height:1.4}
.wgrid td:hover .wplus,.wplus:focus-visible{opacity:1}
.wlist{display:none;gap:10px}
.wtag{border:2px solid var(--line-strong);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.wtag.heute{border-color:var(--mag)}
@media (max-width:760px){ .wgrid-wrap{display:none} .wlist{display:grid} }
.mvgl{font-size:12px;color:var(--muted);margin-top:2px}
.mvgl.abw{color:var(--warn);font-weight:600}
.startgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.startgrid .sb{min-width:0;display:grid}
.startgrid .sb-breit{grid-column:1/-1}
@media (max-width:1000px){ .startgrid{grid-template-columns:minmax(0,1fr)} }
.sbliste{display:grid;gap:6px;margin:4px 0}
.sbrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center;border:2px solid var(--line-strong);border-radius:8px;padding:6px 8px;background:var(--surface)}
.sbrow.aus{opacity:.55;background:var(--sunk)}
.sbname{display:flex;gap:8px;align-items:center;font-weight:600;min-width:0}
.sbname input{width:20px;height:20px;flex:none}
.sbrow .btn.on{border-color:var(--accent)}
@media (max-width:1000px){ .sbrow{grid-template-columns:minmax(0,1fr) auto auto} .sbrow [data-act="sbbreit"]{display:none} .sbrow [data-act="sbmove"]{min-width:44px} }
.luecken{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.lueck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.lueck:hover{border-color:var(--accent)}
.lueck .t2{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lueck .n{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--warn);min-width:28px;text-align:center}
button.kpi:hover{border-color:var(--accent)}
button.kpi .l::after{content:" ›";color:var(--muted)}
/* Tabellen am Handy als Karten */
@media (max-width:640px){
  .tbl-wrap{margin-inline:0;padding-inline:0}
  table.kt thead{display:none}
  table.kt, table.kt tbody{display:block}
  table.kt tr{display:block;border:2px solid var(--line-strong);border-radius:10px;margin:8px 0;padding:6px 12px;background:var(--surface)}
  table.kt tr.grp{border:0;background:none;padding:10px 0 0;margin:12px 0 0}
  table.kt td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;padding:5px 0;text-align:right}
  table.kt td>*{text-align:right}
  table.kt td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none;max-width:42%}
  table.kt tr.grp td{display:block;text-align:left;background:none}
  table.kt tr.click:hover td{background:none}
}
/* Druck / PDF: nur der Bericht */
@media print{
  @page{size:A4;margin:14mm}
  body.printing *{visibility:hidden}
  body.printing .doc, body.printing .doc *{visibility:visible}
  body.printing .doc{position:absolute;left:0;top:0;width:100%;max-width:none;box-shadow:none;padding:0;border-radius:0}
  body.printing .doc .vorschau-hinweis, body.printing .doc .no-print{display:none}
  body.printing .doc section:not(.kblock){break-inside:avoid}
  body.printing .doc .pgrp{break-inside:avoid}
  body{background:#fff}
}
.who select{min-height:34px;padding:5px 8px;width:auto}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modes button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-left:1px solid var(--line)}
.modes button:first-child{border-left:0}
.modes button.on{background:var(--accent);color:var(--accent-ink)}
.modes button[disabled]{opacity:.4;cursor:not-allowed}

.shell{max-width:1320px;margin:0 auto;display:grid;gap:18px;padding-block:22px 48px}
.nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;width:100%;justify-content:flex-start}
.nav > button:first-child{margin-left:auto}
.nav > button:last-of-type{margin-right:auto}
.nav button{border:0;background:none;padding:14px 10px 12px;font-weight:500;font-size:14.5px;letter-spacing:.02em;text-transform:uppercase;color:#fff;white-space:nowrap;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:3px solid transparent}
.nav button:hover{border-bottom-color:rgba(255,255,255,.45)}
.nav button.on{border-bottom-color:var(--mag);font-weight:600}
.nav button:focus-visible{outline-color:#fff}
.nav .cnt{font:600 11.5px var(--f-mono);background:var(--mag);color:#fff;border-radius:999px;padding:1px 7px;letter-spacing:0}
.nav .cnt.live{background:#fff;color:var(--brand)}
main{min-width:0;display:grid;gap:18px;align-content:start}

h1{font:800 32px/1.1 var(--f-display);margin:0;letter-spacing:.005em;text-wrap:balance;color:var(--brand)}
h1 .mono{font-size:.75em;color:var(--mag);margin-right:8px}
h2{font:700 20px/1.2 var(--f-display);margin:0;letter-spacing:.01em;color:var(--brand)}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;gap:18px}
@media (min-width:1000px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2.wide-l{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;padding:14px 16px;display:block}
.kpi .n{font:700 38px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)} .kpi.acc .n{color:var(--accent)}

.btn{font-weight:600;font-size:14.5px;padding:8px 14px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunk)}
/* Übergänge: dezent, nur beim Wechsel der Ansicht */
.btn,.chip,.kpi,.lueck,.gitem,.wjob,.nav button,.panel tr.click td{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .15s ease}
button.kpi:hover,.lueck:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(18,53,91,.10)}
.btn:active,.chip:active,.kpi:active{transform:scale(.98)}
@keyframes v-ein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes v-rechts{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes v-links{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes m-ein{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blende{from{opacity:0}to{opacity:1}}
@keyframes runter{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#app.v-ein{animation:v-ein .22s ease-out}
#app.v-rechts{animation:v-rechts .22s ease-out}
#app.v-links{animation:v-links .22s ease-out}
#modal:not([hidden]){animation:blende .15s ease-out}
#modal:not([hidden]) .mbox{animation:m-ein .2s ease-out}
#toast:not([hidden]){animation:m-ein .2s ease-out}
.gres:not([hidden]){animation:runter .15s ease-out}
@media (max-width:900px){ .band.open .band-in .nav{animation:runter .18s ease-out} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sigdel{color:var(--bad);border:2px solid var(--bad);background:var(--surface)}
.btn.sigdel:hover{background:var(--bad);color:#fff}
.btn.block{width:100%;min-height:48px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;justify-self:start;min-height:42px;padding:8px 16px 8px 12px;border:2px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--brand);font:600 15px var(--f-body);cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.back:hover{background:var(--sunk);border-color:var(--accent)}
@media (max-width:640px){.back{min-height:46px;font-size:16px}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.code{font:600 13px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}

.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.steps span{padding:3px 10px;border-radius:4px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk)}
.steps span.past{color:var(--ink)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}

.tbl-wrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td .t2{display:block;color:var(--muted);font-size:13px}
tr.grp td{background:var(--sunk);font-weight:600;padding:7px 10px}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}

input,select,textarea{font:inherit;font-size:15px;padding:8px 10px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.inset{background:var(--sunk);padding:12px;border-radius:8px;align-items:end}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink);font-size:14px}

.kgroup{display:grid;gap:8px}
.kname{font:700 17px var(--f-display);letter-spacing:.01em}
.alist{display:grid;gap:8px}
.aitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.aitem:hover{border-color:var(--accent)}
.aitem b{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.facts>div>span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.pdf{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.pdf:hover{border-color:var(--accent)}
.pdf i{font:700 11px var(--f-mono);font-style:normal;background:var(--bad);color:var(--surface);border-radius:4px;padding:4px 5px;flex:none}
.pdf span{min-width:0;overflow-wrap:anywhere}

/* Karte */
.mapbox{background:var(--map-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;isolation:isolate}
.lmap{height:560px;max-height:70vh}
.lmap.mini{height:320px}
.hqpin{width:18px;height:18px;background:var(--mag);border:3px solid var(--brand);border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-container{font-family:var(--f-body)}
.mapbox > svg{display:block;width:100%;height:auto}
.mapbox .grid{stroke:var(--map-grid);stroke-width:1}
.mapbox .town circle{fill:var(--map-town)}
.mapbox .town text{fill:var(--map-town);font:600 17px var(--f-body)}
.mapbox .dot{stroke:var(--surface);stroke-width:2.5;cursor:pointer}
.mapbox .dot.bad{fill:var(--bad)} .mapbox .dot.warn{fill:var(--warn)} .mapbox .dot.ok{fill:var(--ok)} .mapbox .dot.none{fill:var(--muted)}
.mapbox .dot.sel{stroke:var(--ink);stroke-width:4}
.mapbox .hq{fill:var(--signal);stroke:var(--signal-ink);stroke-width:2}
.mapbox .hqt{fill:var(--ink);font:700 18px var(--f-display)}
.mapbox .ring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* Prüfung (Checkliste) */
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.gtitle{font:700 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.fh{font:700 16px var(--f-display);letter-spacing:.01em;padding:14px 0 4px;border-top:2px solid var(--line);margin-top:6px}
.clist>.fh:first-child{border-top:0;margin-top:0;padding-top:0}
.pp{display:grid;grid-template-columns:1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fh+.pp{border-top:0}
.pp .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pp .val{display:flex;align-items:center;gap:6px}
.pp .val input{width:120px;text-align:right;font-family:var(--f-mono);font-size:15px}
.pp .hint{font-size:12.5px;color:var(--muted)}
.pp .mng{display:grid;gap:8px;background:var(--bad-soft);padding:10px;border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:8px 12px;min-width:62px;min-height:44px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.io,.seg button.ja{background:var(--ok);color:var(--surface)}
.seg button.nio{background:var(--bad);color:var(--surface)}
.seg button.nein{background:var(--warn);color:var(--surface)}
.seg button.nv{background:var(--muted);color:var(--surface)}
.cbx{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 14px;min-height:44px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);background:var(--surface)}
.cbx.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.apptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.apptabs .chip{text-align:center;padding:11px 4px;font-size:14.5px;border-width:2px;border-radius:10px;white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fotos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foto{position:relative}
.foto img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.foto button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:var(--surface);cursor:pointer;font-weight:700;line-height:1}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sigs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
canvas.sig{width:100%;height:150px;display:block;border:1px dashed var(--line);border-radius:8px;background:var(--paper);touch-action:none;cursor:crosshair}
.signame{border-top:1px solid var(--ink);padding-top:4px;font-size:13px;font-weight:600;color:var(--ink);margin:2px 8px 0}
#sigvoll{position:fixed;inset:0;z-index:200;background:var(--surface);display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#sigvoll canvas.sig{height:100%;min-height:0;border-width:2px}
#sigvoll .sv-kopf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#sigvoll .sv-dreh{display:none;color:var(--warn);font-weight:600;font-size:13px}
@media (orientation:portrait){ #sigvoll .sv-dreh{display:inline} }
#sigvoll .sv-fuss{justify-content:flex-end}
#sigvoll .sv-fuss .btn{min-width:120px;min-height:46px}
.err{color:var(--bad);font-weight:600}

/* Techniker-App */
.appwrap{width:100%;max-width:440px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-height:680px;box-shadow:0 12px 40px rgba(10,30,40,.12)}
@media (max-width:520px){.appwrap{border-radius:0;border-inline:0;box-shadow:none;min-height:calc(100vh - 140px)}}
.appbar{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;min-height:58px;border-bottom:4px solid var(--mag)}
.appbar b{font:700 19px/1.15 var(--f-display);letter-spacing:.01em;display:block}
.appbar small{opacity:.85;font-size:12.5px}
.appbar button{border:0;background:rgba(255,255,255,.16);color:var(--accent-ink);border-radius:8px;width:38px;height:38px;font-size:20px;cursor:pointer;flex:none}
.appbody{flex:1;padding:14px;display:grid;gap:12px;align-content:start}
.appact{padding:12px 14px;background:var(--surface);border-top:1px solid var(--line);display:grid;gap:8px;position:sticky;bottom:0}
.jcard{background:var(--surface);border:2px solid var(--line-strong);border-radius:12px;padding:12px 14px;display:grid;gap:3px;text-align:left;width:100%;cursor:pointer}
.jcard:hover{border-color:var(--accent)}
.jcard .top2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.jcard b{font-weight:600;font-size:16px}
.card{background:var(--surface);border:2px solid var(--line-strong);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--surface);border:2px solid var(--line-strong);border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%}
.krow:hover{border-color:var(--accent)}
details.kdet{display:block}
details.kdet>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
details.kdet>summary::-webkit-details-marker{display:none}
details.kdet>summary .kdet-hint{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:600;color:var(--brand);background:var(--surface)}
details.kdet>summary .kdet-hint::after{content:"Komponenten anzeigen ▾"}
details.kdet[open]>summary .kdet-hint::after{content:"Zuklappen ▴"}
.gtoggle{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px 12px;font-weight:600;cursor:pointer;text-align:left;margin-top:4px}
.gtoggle[aria-expanded="false"]{background:var(--accent-soft);color:var(--brand)}
.krow b{font-weight:600}
.okbig{text-align:center;padding:26px 10px;display:grid;gap:8px;justify-items:center}
.okbig .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-size:34px;font-weight:700}

/* Wartungsbericht */
.doc{background:var(--paper);color:var(--paper-ink);max-width:840px;width:100%;padding:40px 44px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.14),0 10px 30px rgba(0,0,0,.08);font-size:13.5px;line-height:1.45;display:grid;gap:22px}
@media (max-width:620px){.doc{padding:22px 18px}}
.doc-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--paper-brand);padding-bottom:14px}
.doc-firm{font:800 26px/1 var(--f-body);color:var(--paper-brand);letter-spacing:.005em}
.doc-sub{font-size:11.5px;letter-spacing:.09em;color:var(--paper-brand);margin-top:4px}
.doc-sub i{color:var(--paper-mag);font-weight:700;margin-inline:.35em}
.doc-type{color:var(--paper-brand)}
.doc-type{font:700 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.doc .r{text-align:right}
.doc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;margin:0}
.doc-meta dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-muted);font-weight:600}
.doc-meta dd{margin:2px 0 0}
.doc h3{font:700 16px var(--f-display);margin:0 0 6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;letter-spacing:.01em}
.doc h3 span{font-weight:500;font-size:12.5px;font-family:var(--f-body);color:var(--paper-muted)}
.doc .tbl-wrap{margin:0;padding:0}
.doc table{font-size:13px}
.doc th{color:var(--paper-muted);border-bottom:1.5px solid var(--paper-ink);padding:5px 8px;font-size:11px}
.doc td{border-bottom:1px solid var(--paper-line);padding:5px 8px}
.doc tr.dh td{background:var(--paper-sunk);font-weight:700}
.doc td.res{white-space:nowrap;font-weight:600;text-align:right}
.doc .io{color:var(--paper-ok)} .doc .nio{color:var(--paper-bad)} .doc .nv{color:var(--paper-muted)}
.doc .summary{padding:10px 14px;border:1.5px solid currentColor;border-radius:4px;font-weight:600}
.doc .sigbox{border-top:1px solid var(--paper-ink);padding-top:6px;font-size:12px;color:var(--paper-muted)}
.doc .sigspace{height:74px}
.doc .sigs{grid-template-columns:minmax(0,300px)}
.doc .sigs img{max-width:100%;object-fit:contain;object-position:left bottom}
.doc .foot{font-size:11px;color:var(--paper-muted);border-top:1px solid var(--paper-line);padding-top:10px}
.doc .fotos img{width:110px;height:82px;object-fit:cover;border:1px solid var(--paper-line)}
.doc{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .sumtbl{max-width:560px}
.doc .doc-h{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-muted);margin:4px 0 -10px}
.doc .kblock{border:1.5px solid var(--paper-line);border-radius:6px;overflow:hidden;display:grid}
.doc .khead{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--paper-sunk);border-bottom:1.5px solid var(--paper-line);break-after:avoid}
.doc .knr{font:700 13px var(--f-mono);background:var(--paper-brand);color:#fff;border-radius:4px;padding:3px 7px;flex:none}
.doc .kname{flex:1;min-width:0;display:grid}
.doc .kname b{font:700 14.5px var(--f-display)}
.doc .kname small{color:var(--paper-muted);font-size:11.5px}
.doc .kres{flex:none;font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px;border:1.5px solid currentColor}
.doc .kres.io{color:var(--paper-ok)} .doc .kres.nio{color:var(--paper-bad)}
.doc .pgrp{padding:6px 12px 8px}
.doc .pgrp + .pgrp{border-top:1px solid var(--paper-line)}
.doc .pgt{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-brand);margin:2px 0 2px}
.doc .pitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;grid-auto-flow:row dense}
@media (max-width:620px){ .doc .pitems{grid-template-columns:minmax(0,1fr)} }
.doc .pi{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:4px 0;border-bottom:1px dotted var(--paper-line);break-inside:avoid}
.doc .pi .pl{flex:1 1 auto;min-width:0}
.doc .pi .pr{flex:none;display:flex;gap:6px;align-items:baseline}
.doc .pi .pm{flex-basis:100%;font-size:12px;color:var(--paper-bad)}
.doc .pi.bad .pl{color:var(--paper-bad);font-weight:600}
.doc .pi.txt{display:grid;gap:0}
.doc .pi.txt.lang{grid-column:1/-1}
.doc .pi.txt .pl{font-size:11.5px;color:var(--paper-muted)}
.doc .pi.txt .pt{white-space:pre-wrap}
.doc .rm{font-weight:700;font-size:12px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.doc .rm.io{color:var(--paper-ok);background:rgba(35,120,74,.10)}
.doc .rm.nio{color:var(--paper-bad);background:rgba(180,51,42,.10)}
.doc .rm.nv,.doc .rm.leer{color:var(--paper-muted);background:var(--paper-sunk)}
.doc .rm.ja{color:var(--paper-ink);background:var(--paper-sunk)}
.doc .rm.wert{font-family:var(--f-mono);color:var(--paper-ink);background:var(--paper-sunk)}
.doc .rm.wert.nio{color:var(--paper-bad);background:rgba(180,51,42,.10)}
.doc .vorher{font-size:11px;color:var(--paper-muted);white-space:nowrap}
.doc .fotos{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.doc .pinline{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;line-height:1.5;padding:1px 0 3px}
.doc .pk{max-width:100%}
.doc .pk b{font-size:11.5px;margin-right:2px}
.doc .pk b.io{color:var(--paper-ok)} .doc .pk b.nv,.doc .pk b.leer{color:var(--paper-muted)} .doc .pk b.ja{color:var(--paper-ink)}
.doc .pgrp.kz{padding:4px 12px 5px}
.doc .pgt-in{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-brand);margin-right:2px}
.doc .pgt-in::after{content:":"}
.doc .pinline + .pitems{margin-top:4px;border-top:1px dotted var(--paper-line)}
.doc .kzus{padding:6px 12px 8px;font-size:12px;color:var(--paper-ok);border-top:1px solid var(--paper-line)}
.doc .kzus::before{content:"✓ "}
.doc .ohnetbl{width:100%;font-size:12.5px}
.doc .ohnetbl td{padding:5px 12px;vertical-align:top}
.doc .ohnetbl td.r .t2{font-size:11px;color:var(--paper-muted);font-weight:400}

.label{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:6px;padding:12px;display:flex;gap:14px;align-items:center;max-width:100%}
.label .qr{width:104px;height:104px;flex:none;display:grid;place-items:center;background:#fff}
.label .qr img,.label .qr canvas{width:104px;height:104px}
.label b{font:700 20px var(--f-display);display:block}
.label small{display:block;color:var(--paper-muted);font-size:12px}

#modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--surface);border-radius:12px;max-width:560px;width:100%;padding:20px;max-height:90%;overflow:auto;display:grid;gap:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
ul.list{margin:0;padding-left:20px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    const pruefen = () => { if(!LMAPS.includes(map) || !el.clientWidth || !el.clientHeight) return; map.invalidateSize();
      // Karte komplett neu aufbauen, jetzt mit Größe: Ausschnitt und Punkte stimmen dann sicher
      if(ohneGroesse && !bewegt){ ohneGroesse = false; initMaps(); } };
    if(window.ResizeObserver){ const ro = new ResizeObserver(pruefen); ro.observe(el); map.on('unload', () => ro.disconnect()); }
    addEventListener('resize', pruefen); document.addEventListener('visibilitychange', pruefen);
    map.on('unload', () => { removeEventListener('resize', pruefen); document.removeEventListener('visibilitychange', pruefen); });
    [300, 1000, 2500].forEach(t => setTimeout(pruefen, t));
    LMAPS.push(map);
  });
}

/* ---------- Büro: Wochenplanung ---------- */
const montag = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; };
const plusTage = (isoS, n) => { const x = new Date(isoS+'T00:00:00'); x.setDate(x.getDate()+n); return iso(x); };
const kw = isoS => { const d = new Date(isoS+'T00:00:00'); d.setDate(d.getDate() + 3 - (d.getDay()+6)%7); const j = new Date(d.getFullYear(),0,4); return 1 + Math.round(((d-j)/864e5 - 3 + (j.getDay()+6)%7)/7); };
const TAGE = ['Mo','Di','Mi','Do','Fr','Sa','So'];
function vWoche(){
  const mo = UI.wo || iso(montag(TODAY)), so = plusTage(mo, 6);
  const imZeitraum = S.auftraege.filter(a => a.datum >= mo && a.datum <= so);
  const wochenende = imZeitraum.some(a => a.datum > plusTage(mo, 4));
  const tage = [...Array(wochenende ? 7 : 5)].map((_,i) => plusTage(mo, i));
  const zeilen = appUsers().map(u => ({id:u.id, name:u.name})).concat([{id:'', name:'Nicht zugeteilt'}]);
  const inZelle = (tid, tag) => imZeitraum.filter(a => a.datum===tag && (tid ? (a.techIds||[]).includes(tid) : !(a.techIds||[]).length))
    .sort((x,y) => (x.zeit||'99') < (y.zeit||'99') ? -1 : 1);
  const karte = (a, tid) => { const {o} = ctx(a.anlageId), zieh = ['planung','geplant'].includes(a.status);
    return `<button class="wjob st-${a.status}" data-act="auftrag" data-id="${a.id}" ${zieh ? `draggable="true" data-drag="${a.id}" data-von="${tid}"` : ''} title="${h(o.name)} · ${h(statusLabel(a.status))}">
      <span class="wz">${a.zeit ? h(a.zeit) : ''} <b>${h(a.nr)}</b></span><span class="wo">${h(o.name)}</span><span class="t2">${h(o.ort)}</span></button>`; };
  const heute = iso(TODAY);
  // Fällig bis Wochenende und noch kein Auftrag
  const offen = S.anlagen.filter(a => !offenerAuftrag(a.id)).map(a => ({a, ks:kompsOf(a.id).filter(c => { const d = nextDue(c); return d && d <= so; })})).filter(x => x.ks.length)
    .sort((x,y) => cmpDe(ctx(x.a.id).o.nr, ctx(y.a.id).o.nr));
  return `<div class="head"><div><h1>Wochenplanung</h1><p class="sub">KW ${kw(mo)} · ${fmt(mo)} bis ${fmt(tage[tage.length-1])} · ${imZeitraum.length} Aufträge</p></div>

    <p class="muted small" style="margin:0">Aufträge „In Planung“ und „Geplant“ lassen sich am PC mit der Maus auf einen anderen Tag oder Techniker ziehen. Mit + wird ein neuer Auftrag an diesem Tag geplant.</p>

document.addEventListener('dragstart', e => { const k = e.target.closest && e.target.closest('[data-drag]'); if(!k) return;
  e.dataTransfer.setData('text/plain', k.dataset.drag + '|' + k.dataset.von); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if(!z) return; e.preventDefault(); z.classList.add('ziel'); });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if(z) z.classList.remove('ziel'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if(!z) return; e.preventDefault();
  const [id, von] = (e.dataTransfer.getData('text/plain')||'').split('|'), A = by(S.auftraege, id); if(!A) return;
  const nach = z.dataset.tech; let ids = (A.techIds||[]).filter(x => x!==von);
  ids = nach ? [...new Set(ids.concat(nach))] : (von ? ids : []);
  if(!nach && ids.length){ toast('Erst alle Techniker entfernen, dann ist der Auftrag nicht zugeteilt'); render(); return; }
  const alt = `${fmt(A.datum)} ${techNames(A.techIds)}`;
  A.datum = z.dataset.drop; A.techIds = ids;
  if(A.status==='planung' && ids.length) A.status = 'geplant';
  if(!ids.length && A.status==='geplant') A.status = 'planung';
  A.verlauf = (A.verlauf||[]).concat(`${fmt(iso(TODAY))} ${nowTime()}: ${me().name} hat umgeplant (vorher ${alt})`);
  save(); render(); toast(`${A.nr} auf ${fmt(A.datum)} · ${techNames(A.techIds)}`);
});

function vKarte(){

    const g = geo(sel), k = by(S.kunden, sel.kundeId), s = objSt(sel.id);

    const near = mapPoints('alle').filter(p => p.o.id!==sel.id).map(p => ({...p, d:km(g,[p.lat,p.lng])})).filter(p => p.d <= 20).sort((a,b) => a.d-b.d);

        (oa ? `<button class="btn sm" data-act="auftrag" data-id="${oa.id}">Auftrag ${oa.nr}</button>` : `<button class="btn sm pri" data-act="planen" data-a="${a.id}">Auftrag planen</button>`); }).join('')}</div>
      <h2 style="font-size:17px">In der Nähe (20 km)</h2>

      ${due.length ? `<div class="tbl-wrap"><table><tbody>${due.map(p => `<tr class="click" data-act="mapsel" data-id="${p.o.id}"><td><span class="code">${h(p.o.nr)}</span> ${h(p.o.name)}<span class="t2">${h(p.o.ort)}</span></td><td>${pill(p.cls,p.label)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Nichts fällig.</div>`}</section>`;

/* ---------- Büro: Kunden & Anlagen ---------- */
const kName = k => (k.name || k.nr || '').trim();
const ersterBuchstabe = k => { const c = kName(k).charAt(0).toUpperCase().replace(/[ÄÖÜ]/, x => ({Ä:'A',Ö:'O',Ü:'U'}[x])); return /[A-Z]/.test(c) ? c : '#'; };
function buchstaben(){ return [...new Set(S.kunden.filter(k => S.objekte.some(o => o.kundeId===k.id)).map(ersterBuchstabe))].sort(); }
const cmpDe = (x,y) => String(x||'').localeCompare(String(y||''), 'de', {numeric:true, sensitivity:'base'});
const rankSt = {bad:0, warn:1, '':2, ok:3};
const anlagenVon = k => S.objekte.filter(o => o.kundeId===k.id).flatMap(o => S.anlagen.filter(a => a.objektId===o.id).map(a => ({o, a})));
const naechsteVon = aids => aids.flatMap(id => kompsOf(id).map(nextDue)).filter(Boolean).sort()[0] || '';
function stVon(aids){
  const s = aids.map(anlSt).sort((a,b) => rankSt[a.cls]-rankSt[b.cls])[0];
  return s || {cls:'', label:'Keine Anlage'};
}
function vKunden(){
  const modus = UI.km || 'kunden';
  const sorts = modus==='kunden' ? [['name','Name'],['nummer','Kundennummer'],['faellig','Fälligkeit']] : [['nummer','Objektnummer'],['name','Name'],['faellig','Fälligkeit']];
  if(!sorts.some(([v]) => v===UI.ks)) UI.ks = sorts[0][0];
  return `
  <div class="head"><div><h1>Kunden & Anlagen</h1><p class="sub">${S.kunden.length} Kunden · ${S.objekte.length} Objekte · ${S.komponenten.filter(c => !c.entfernt).length} Komponenten</p></div>
    <div class="row"><button class="btn" data-act="importieren">Foxtag-Export importieren</button><button class="btn pri" data-act="neuobjekt">Kunde / Objekt anlegen</button></div></div>
  <section class="panel">
    <div class="row" style="justify-content:space-between;gap:12px">
      <div class="modes" role="group" aria-label="Ansicht">${[['kunden','Kunden'],['objekte','Objekte']].map(([v,l]) => `<button data-act="kmodus" data-v="${v}" class="${modus===v?'on':''}" aria-pressed="${modus===v}">${l}</button>`).join('')}</div>
      <input id="q" type="search" placeholder="${modus==='kunden' ? 'Suchen: Kundennummer, Name oder Ort' : 'Suchen: Objektnummer (z. B. W26-0603), Name oder Ort'}" value="${h(UI.q)}" data-in="q" style="flex:1 1 280px">
    </div>
    <div class="row" style="justify-content:space-between;gap:8px">
      <div class="chips" aria-label="Anfangsbuchstabe">${['', ...buchstaben()].map(b => `<button class="chip ${(UI.kb||'')===b?'on':''}" data-act="kbuch" data-v="${b}" style="min-width:34px;padding-inline:8px">${b || 'Alle'}</button>`).join('')}</div>
      <label class="f" style="display:flex;align-items:center;gap:8px" for="ksort">Sortieren<select id="ksort" data-in="ksort" style="width:auto">${sorts.map(([v,l]) => `<option value="${v}" ${UI.ks===v?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <div id="alist">${kundenList()}</div>
  </section>`;
}
function kundenList(){
  const q = UI.q.trim().toLowerCase(), buch = UI.kb || '', sort = UI.ks || 'name';
  const faelligSort = (x,y) => rankSt[x.s.cls]-rankSt[y.s.cls] || cmpDe(x.next||'9999', y.next||'9999');
  const faelligZelle = r => `<td>${pill(r.s.cls, r.s.label)}${r.next ? `<span class="t2">${fmt(r.next)}</span>` : ''}</td>`;
  if((UI.km || 'kunden')==='kunden'){
    let rows = S.kunden.map(k => ({k, an:anlagenVon(k)})).filter(r => r.an.length);
    if(buch) rows = rows.filter(r => ersterBuchstabe(r.k)===buch);
    if(q) rows = rows.filter(r => [r.k.nr, r.k.name, r.k.adresse, r.k.ort, ...r.an.flatMap(x => [x.o.nr, x.o.name, x.o.ort])].join(' ').toLowerCase().includes(q));
    rows = rows.map(r => { const aids = r.an.map(x => x.a.id); return {...r, s:stVon(aids), n:aids.reduce((s,id) => s + kompsOf(id).length, 0), next:naechsteVon(aids)}; });
    if(!rows.length) return `<div class="empty">Keine Kunden${UI.q ? ` für „${h(UI.q)}“` : ''}.</div>`;
    rows.sort(sort==='nummer' ? (x,y) => cmpDe(x.k.nr, y.k.nr) : sort==='faellig' ? faelligSort : (x,y) => cmpDe(kName(x.k), kName(y.k)));
    return `<div class="muted small">${rows.length} ${rows.length===1 ? 'Kunde' : 'Kunden'}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Kunden-Nr.</th><th>Kunde</th><th>Adresse</th><th style="text-align:right">Objekte</th><th style="text-align:right">Komp.</th><th>Fälligkeit</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="click" data-act="kunde" data-id="${r.k.id}">
        <td class="mono" style="white-space:nowrap">${h(r.k.nr)}</td>
        <td><b style="font-weight:600">${h(kName(r.k))}</b></td>
        <td>${h(r.k.adresse)}<span class="t2">${h(r.k.ort)}</span></td>
        <td class="mono" style="text-align:right">${r.an.length}</td>
        <td class="mono" style="text-align:right">${r.n}</td>
        ${faelligZelle(r)}</tr>`).join('')}</tbody></table></div>`;
  }
  let rows = [];
  S.kunden.forEach(k => {
    if(buch && ersterBuchstabe(k)!==buch) return;
    anlagenVon(k).forEach(({o,a}) => {
      if(q && ![k.nr, k.name, o.nr, o.name, o.adresse, o.ort].join(' ').toLowerCase().includes(q)) return;
      rows.push({k, o, a, s:anlSt(a.id), n:kompsOf(a.id).length, next:naechsteVon([a.id])});
    });
  });
  if(!rows.length) return `<div class="empty">Keine Objekte${UI.q ? ` für „${h(UI.q)}“` : ''}.</div>`;
  rows.sort(sort==='name' ? (x,y) => cmpDe(x.o.name, y.o.name) : sort==='faellig' ? faelligSort : (x,y) => cmpDe(x.o.nr||'~', y.o.nr||'~'));
  return `<div class="muted small">${rows.length} ${rows.length===1 ? 'Objekt' : 'Objekte'}</div>

/* ---------- Notizen & Dateien je Anlage ---------- */
const fmtSize = b => b < 1024*1024 ? Math.max(1, Math.round(b/1024))+' KB' : (b/1024/1024).toFixed(1).replace('.',',')+' MB';
const dokArt = d => /pdf/i.test(d.type) || /\.pdf$/i.test(d.name) ? 'PDF' : /^image\//.test(d.type) ? 'BILD' : /\.(dwg|dxf)$/i.test(d.name) ? 'PLAN' : /\.(docx?|odt)$/i.test(d.name) ? 'DOC' : /\.(xlsx?|csv|ods)$/i.test(d.name) ? 'XLS' : 'DATEI';
function notizList(a, kurz){
  const list = (a.notizen||[]).slice().sort((x,y) => x.am < y.am ? 1 : -1).slice(0, kurz ? 3 : 999);
  return list.length ? list.map(n => `<div class="card" style="gap:4px;padding:10px 12px">
      <div style="white-space:pre-wrap">${h(n.text)}</div>

    : `<div class="empty">Noch keine Notizen.</div>`;
}
function notizPanel(a){
  return `<section class="panel"><div class="panel-h"><h2>Notizen</h2><span class="muted small">auch in der Techniker-App sichtbar</span></div>

      <label class="f" for="nz-${a.id}">Neue Notiz<textarea id="nz-${a.id}" name="text" required placeholder="z. B. Zugang nur mit Hausmeister, Herr Müller, Tel. im Büro hinterlegt"></textarea></label>
      <button class="btn pri sm" type="submit" style="justify-self:start">Notiz speichern</button></form>
    <div style="display:grid;gap:8px">${notizList(a)}</div></section>`;

function dokList(a, inApp){
  const list = (a.dateien||[]).slice().sort((x,y) => x.am < y.am ? 1 : -1);
  return list.length ? `<div class="alist">${list.map(d => `<div class="pdf" style="cursor:default">
      <i style="${dokArt(d)==='PDF' ? '' : 'background:var(--accent)'}">${dokArt(d)}</i>
      <span style="flex:1"><b>${h(d.name)}</b><span class="muted small" style="display:block">${fmtSize(d.size)} · ${fmt(d.am.slice(0,10))} · ${h(d.von)}</span></span>
      <button class="btn sm" data-act="dokopen" data-a="${a.id}" data-id="${d.id}">Öffnen</button>
      ${inApp ? '' : `<button class="btn ghost sm danger" data-act="dokdel" data-a="${a.id}" data-id="${d.id}" aria-label="${h(d.name)} löschen">✕</button>`}
    </div>`).join('')}</div>` : `<div class="empty">${inApp ? 'Keine Dokumente hinterlegt.' : 'Noch keine Dateien. Zum Beispiel Handbücher, Schaltpläne oder Grundrisse hochladen.'}</div>`;
}
function dateiPanel(a){
  return `<section class="panel"><div class="panel-h"><h2>Dateien</h2>
      <label class="btn sm pri upl">Datei hochladen<input type="file" multiple data-dupload="${a.id}"></label></div>
    <p class="muted small" style="margin:0">Handbücher, Pläne, Fotos. Im Prototyp nur in diesem Browser gespeichert, später auf eurem Server. Max. 25 MB je Datei.</p>
    ${dokList(a)}</section>`;
}
async function dateienHochladen(aid, files){
  const a = by(S.anlagen, aid); a.dateien = a.dateien || [];
  let n = 0;
  for(const file of files){
    if(file.size > 25*1024*1024){ toast(`${file.name} ist größer als 25 MB`); continue; }
    const id = 'f'+uid();
    try{ await IDB.set(id, file, 'files'); }catch(e){ toast(`${file.name} konnte nicht gespeichert werden`); continue; }
    a.dateien.push({id, name:file.name, type:file.type||'', size:file.size, am:new Date().toISOString(), von:me().name}); n++;
  }
  await saveNow(); render();
  if(n) toast(n===1 ? 'Datei hochgeladen' : `${n} Dateien hochgeladen`);
}
async function dokOeffnen(aid, id){
  const d = (by(S.anlagen, aid).dateien||[]).find(x => x.id===id); if(!d) return;
  let blob; try{ blob = await IDB.get(id, 'files'); }catch(e){}
  if(!blob){ toast('Datei ist in diesem Browser nicht vorhanden'); return; }
  const url = URL.createObjectURL(blob), art = dokArt(d);
  openModal(`<div class="panel-h"><h2 style="overflow-wrap:anywhere">${h(d.name)}</h2><button class="btn ghost sm" data-close>Schließen</button></div>
    ${art==='BILD' ? `<img src="${url}" alt="${h(d.name)}" style="width:100%;border-radius:8px">` : ''}
    ${art==='PDF' ? `<iframe src="${url}" title="${h(d.name)}" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:8px"></iframe>` : ''}
    <div class="row"><a class="btn pri" href="${url}" target="_blank" rel="noopener" download="${h(d.name)}">In neuem Fenster öffnen</a><span class="muted small">${fmtSize(d.size)}</span></div>`);
  modal.querySelector('.mbox').style.maxWidth = art==='DATEI' ? '' : '900px';
}

function vAuftraege(){

  const list = S.auftraege.filter(F[UI.af]).sort((x,y) => (x.datum+x.zeit) < (y.datum+y.zeit) ? -1 : 1);
  if(UI.af!=='offen') list.reverse();

    ${(A.verlauf||[]).length ? `<div><span>Verlauf</span>${A.verlauf.map(v => `<span class="small" style="display:block">${h(v)}</span>`).join('')}</div>` : ''}

/* ---------- Büro: Berichte ---------- */
function vBerichte(){
  const list = S.berichte.slice().sort((a,b) => (a.erstellt+(a.zeit||'')) < (b.erstellt+(b.zeit||'')) ? 1 : -1);
  const mails = S.mails.slice().sort((a,b) => (a.am+(a.zeit||'')) < (b.am+(b.zeit||'')) ? 1 : -1);
  return `<div><h1>Berichte</h1><p class="sub">Alle aus der App zurückgeschickten Wartungsberichte. Jeder liegt auch im Kundenordner der Anlage.</p></div>
  <div class="grid2 wide-l" style="align-items:start">
    <section class="panel">${list.length ? `<div class="alist">${list.map(pdfItem).join('')}</div>` : `<div class="empty">Noch keine Berichte.</div>`}</section>
    <section class="panel"><h2>E-Mails ans Büro</h2><p class="muted small" style="margin:0">Empfänger einstellbar unter Administration → E-Mail. Im Prototyp nur nachgestellt, es wird nichts verschickt.</p>
      ${mails.length ? `<div class="tbl-wrap"><table><tbody>${mails.map(m => `<tr><td>${h(m.betreff)}<span class="t2">an ${h(m.an)} · ${fmt(m.am)}${m.zeit ? ' '+m.zeit : ''} · Anhang ${h(m.datei)}</span></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Noch keine E-Mails.</div>`}</section>
  </div>`;
}
function berichtAblegen(A, mitMail){
  const {o,k} = ctx(A.anlageId);
  const n = A.korrektur || 0, alt = aktBericht(A);
  const b = {id:uid(), auftragId:A.id, fassung:n, datei:`Wartungsbericht_${A.nr}_${(o.nr||'Objekt').replace(/[^\w-]/g,'')}${n ? '_Korrektur'+n : ''}.pdf`, erstellt: n ? iso(TODAY) : (A.abgeschlossen || A.datum), zeit: mitMail ? nowTime() : ''};
  if(n && alt){ alt.ersetzt = true; alt.ersetztDurch = b.id; b.ersetztBericht = alt.datei; b.ersetztVom = alt.erstellt; }
  S.berichte.push(b);
  S.mails.push({id:uid(), berichtId:b.id, an:S.settings.bueroMail, betreff:`${n ? 'Korrektur: ' : ''}Wartungsbericht ${A.nr} · ${o.nr} ${o.name} · ${k.name}${n && alt ? ` (ersetzt Bericht vom ${fmt(alt.erstellt)})` : ''}`, am:b.erstellt, zeit:b.zeit, datei:b.datei});
  return b;
}

  <article id="itguide" style="display:grid;gap:18px">
  <section class="panel"><h2>Anleitung für die IT: Wartungsportal im eigenen Netz betreiben</h2>
    <p style="margin:0"><b>Stand heute:</b> Das Portal ist ein Prototyp. Es besteht aus einer einzelnen Web-Seite (<span class="mono">index.html</span>), einem Service Worker für den Offline-Betrieb (<span class="mono">sw.js</span>), einem App-Manifest und Symbolen. Alle Daten liegen bisher nur im Browser des jeweiligen Geräts (IndexedDB), es gibt noch keinen Server. Quellcode: <a href="${repo}" target="_blank" rel="noopener">${repo}</a> (öffentlich, ohne Kundendaten).</p>
    <p style="margin:0"><b>Ziel:</b> Gemeinsame Daten für Büro und alle Techniker auf dem eigenen Server, Anmeldung mit der Firmen-E-Mail, Berichte als PDF, Versand per E-Mail, Sicherung aufs NAS. Die Oberfläche wird weiterverwendet.</p></section>

  <section class="panel"><h2>1. Zielarchitektur</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Baustein</th><th>Vorschlag</th><th>Zweck</th></tr></thead><tbody>
      <tr><td><b>Server</b></td><td>Virtuelle Maschine mit Linux (z. B. Ubuntu Server 24.04 LTS), Docker und Docker Compose</td><td>Alles läuft in Containern, leicht zu sichern und zu aktualisieren</td></tr>
      <tr><td><b>Webserver / Reverse Proxy</b></td><td>Caddy oder nginx mit HTTPS-Zertifikat</td><td>Liefert die Oberfläche aus, leitet API-Aufrufe weiter, erzwingt HTTPS</td></tr>
      <tr><td><b>Anwendung (API)</b></td><td>Node.js/TypeScript oder Python (FastAPI)</td><td>Benutzer und Rechte, Kunden, Anlagen, Aufträge, Checklisten, Störungen, Abgleich mit der App</td></tr>
      <tr><td><b>Datenbank</b></td><td>PostgreSQL</td><td>Alle Stammdaten, Aufträge und Prüfergebnisse</td></tr>
      <tr><td><b>Dateiablage</b></td><td>Ordner auf dem Server (Docker-Volume)</td><td>PDF-Berichte, Fotos, Handbücher und Pläne</td></tr>
      <tr><td><b>Anmeldung</b></td><td>Microsoft Entra ID (falls Microsoft 365) über OpenID Connect</td><td>Login mit der Gundermann-E-Mail, kein eigenes Passwort, Sperre beim Austritt automatisch</td></tr>
      <tr><td><b>E-Mail</b></td><td>Dienstpostfach, z. B. wartung@…, über Microsoft Graph oder SMTP</td><td>Berichte ans Büro und an Kunden schicken</td></tr>
      <tr><td><b>PDF</b></td><td>Serverseitig, z. B. mit Headless Chromium</td><td>Wartungsbericht mit Logo als PDF</td></tr>
      <tr><td><b>App</b></td><td>Installierbare Web-App (PWA), bereits vorhanden</td><td>Aufträge vorab aufs Handy laden, offline prüfen, bei Netz abgleichen</td></tr>
    </tbody></table></div></section>

  <section class="panel"><h2>2. Was die IT bereitstellen muss</h2>
    <div class="tbl-wrap"><table><thead><tr><th style="width:36px"></th><th>Aufgabe</th><th>Details</th></tr></thead><tbody>
      <tr><td>☐</td><td><b>Virtuelle Maschine</b></td><td>2–4 vCPU, 8 GB RAM, 100 GB SSD. Linux mit Docker und Docker Compose. SSH-Zugang nur aus dem Firmennetz.</td></tr>
      <tr><td>☐</td><td><b>Adresse im Internet</b></td><td>Subdomain, z. B. <span class="mono">wartung.&lt;firmendomain&gt;.de</span>, mit DNS-Eintrag auf die öffentliche IP der Firma.</td></tr>
      <tr><td>☐</td><td><b>Erreichbarkeit von außen</b></td><td>Techniker arbeiten beim Kunden. Port 443 (HTTPS) per Portweiterleitung oder DMZ auf den Reverse Proxy. Alternative: VPN auf allen Firmenhandys (mehr Aufwand im Alltag).</td></tr>
      <tr><td>☐</td><td><b>HTTPS-Zertifikat</b></td><td>Let's Encrypt (automatisch über Caddy) oder ein Firmenzertifikat. Ohne HTTPS funktionieren App-Installation und Offline-Betrieb nicht.</td></tr>
      <tr><td>☐</td><td><b>Firewall</b></td><td>Eingehend nur 443. Datenbank nicht von außen erreichbar. Updates des Systems automatisch einspielen.</td></tr>
      <tr><td>☐</td><td><b>Anmeldung (Entra ID)</b></td><td>App-Registrierung „Gundermann Wartungsportal“ anlegen, Redirect-URI <span class="mono">https://wartung.&lt;firmendomain&gt;.de/auth/callback</span>. Drei Gruppen: <i>Wartung-Admin</i>, <i>Wartung-Büro</i>, <i>Wartung-Techniker</i>.</td></tr>
      <tr><td>☐</td><td><b>Dienstpostfach</b></td><td>Postfach für den Berichtsversand, mit Sende-Berechtigung für die Anwendung.</td></tr>
      <tr><td>☐</td><td><b>Datensicherung aufs NAS</b></td><td>Jede Nacht Datenbank-Sicherung und Dateiablage aufs NAS, z. B. 30 Tage aufbewahren plus Monatsstände. Einmal eine Wiederherstellung testen.</td></tr>
      <tr><td>☐</td><td><b>Überwachung</b></td><td>Benachrichtigung, wenn der Dienst nicht erreichbar ist oder eine Sicherung fehlschlägt.</td></tr>
    </tbody></table></div>
    <p class="muted small" style="margin:0">Nutzt die Firma kein Microsoft 365, ist die Anmeldung auch mit Firmen-E-Mail und Passwort oder per Login-Link möglich. Dann bitte Bescheid geben, welcher Mailanbieter verwendet wird.</p></section>

  <section class="panel"><h2>3. Konten und Rechte</h2><ul class="list">
    <li>Jede Person meldet sich mit ihrer eigenen Gundermann-E-Mail an. Geteilte Konten gibt es nicht mehr, im Bericht steht immer, wer geprüft hat.</li>

  const adresse = [o.adresse, o.ort].filter(Boolean).join(', ');
  const g = geo(o);
  const ziel = adresse || (g ? g[0].toFixed(5)+','+g[1].toFixed(5) : '');

  const href = /iPhone|iPad|iPod/i.test(navigator.userAgent)
    ? 'https://maps.apple.com/?dirflg=d&daddr=' + encodeURIComponent(ziel)
    : 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(ziel);
  return `<a class="btn pri block" href="${h(href)}" target="_blank" rel="noopener">${ico('route')} Route starten</a>`;
}

function appKompList(A){

  if(!ks.length) return `<div class="empty">Keine Komponente passt zu „${h(UI.app.q)}“.</div>`;
  const gruppen = [...new Set(ks.map(c => c.gruppe))];
  return gruppen.map(g => {
    const gk = ks.filter(c => c.gruppe===g), gd = gk.filter(c => A.pr[c.id] && A.pr[c.id].done).length;
    const offen = q || !zu[g];
    return `<button class="gtoggle" data-act="appgrp" data-v="${g}" aria-expanded="${!!offen}">
        <span>${offen ? '▾' : '▸'} Gruppe ${g} · ${gname(g)}</span><span class="small">${gd}/${gk.length} geprüft</span></button>
      ${offen ? gk.map(c => { const t = typOf(c); return `<button class="krow" data-act="appkomp" data-c="${c.id}"><span><b><span class="mono">${kNr(c)}</span> ${h(tname(t))}${tcode(t)}</b><span class="muted small" style="display:block">${h(c.standort)}${c.sn ? ' · S/N '+h(c.sn) : ''}</span></span>${kompState(A,c)}</button>`; }).join('') : ''}`;
  }).join('');
}
function kompState(A,c){

  if(p && p.done) return kompErgebnis(A,c)==='mangel' ? pill('bad','Mangel') : pill('ok','OK');
  const n = p ? Object.values(p.f).filter(x => x.v!=null && x.v!=='' && x.v!==false).length : 0;

}
/* Letzter Messwert derselben Komponente aus einem früheren, abgeschlossenen Auftrag */
function letzterWert(A, c, fid){
  const frueher = S.auftraege.filter(x => x.id!==A.id && ['erledigt','abgerechnet'].includes(x.status) && x.pr && x.pr[c.id] && x.pr[c.id].f && x.pr[c.id].f[fid]
      && String(x.pr[c.id].f[fid].v||'').trim() && (x.abgeschlossen||x.datum) <= (A.status==='laeuft' ? iso(TODAY) : (A.abgeschlossen||A.datum)))
    .sort((x,y) => (x.abgeschlossen||x.datum) < (y.abgeschlossen||y.datum) ? 1 : -1)[0];
  return frueher ? {v:frueher.pr[c.id].f[fid].v, datum:frueher.abgeschlossen||frueher.datum, nr:frueher.nr} : null;
}
const vglText = (vg, x) => `Letztes Mal: ${h(vg.l.v)} ${h(x.einheit)} (${fmt(vg.l.datum)})`
  + (vg.abw!=null && vg.abw!==0 ? ` · ${vg.abw > 0 ? '+' : ''}${vg.abw} %${vg.auffaellig ? ' – bitte prüfen' : ''}` : '');
function wertVergleich(A, c, x, jetzt){
  const l = letzterWert(A, c, x.id); if(!l) return null;
  const a = num(l.v), n = num(jetzt);
  let abw = null;
  if(!isNaN(a) && !isNaN(n) && String(jetzt||'').trim()){ abw = a===0 ? (n===0 ? 0 : null) : Math.round((n-a)/Math.abs(a)*100); }
  return {l, abw, auffaellig: abw!=null && Math.abs(abw) >= 25};
}
function feldRow(A,c,x){
  if(x.typ==='ueberschrift') return `<div class="fh">${h(x.label)}</div>`;
  const d = prOf(A,c.id).f[x.id] || {};
  const attrs = `data-c="${c.id}" data-f="${x.id}"`;
  let ctl = '';
  const seg = opts => `<div class="seg">${opts.map(([v,l]) => `<button data-act="setf" ${attrs} data-v="${v}" class="${d.v===v?v:''}" aria-pressed="${d.v===v}">${l}</button>`).join('')}</div>`;
  if(x.typ==='ionv') ctl = seg([['io','i.O.'],['nio','n.i.O.'],['nv','n.v.']]);
  if(x.typ==='ion') ctl = seg([['io','i.O.'],['nio','n.i.O.']]);
  if(x.typ==='janein') ctl = seg([['ja','Ja'],['nein','Nein']]);
  if(x.typ==='janeinnv') ctl = seg([['ja','Ja'],['nein','Nein'],['nv','n.v.']]);
  if(x.typ==='checkbox') ctl = `<button class="cbx ${d.v?'on':''}" data-act="setf" ${attrs} data-v="toggle" aria-pressed="${!!d.v}">${d.v ? '✓ Erledigt' : 'Erledigt?'}</button>`;
  if(x.typ==='wert'){ const vg = wertVergleich(A, c, x, d.v);
    ctl = `<span class="val"><input inputmode="decimal" data-in="fv" ${attrs} value="${h(d.v||'')}" aria-label="${h(x.label)}"><span>${h(x.einheit)}</span></span>`
      + (vg ? `<div class="mvgl ${vg.auffaellig?'abw':''}" data-vgl="${c.id}-${x.id}">${vglText(vg, x)}</div>` : ''); }
  if(x.typ==='text') return `<div class="pp"><label class="f" for="t-${c.id}-${x.id}">${h(x.label)}<textarea id="t-${c.id}-${x.id}" data-in="fv" ${attrs} style="min-height:44px">${h(d.v||'')}</textarea></label></div>`;
  return `<div class="pp">
    <div>${h(x.label)}${x.max!=null ? `<div class="hint" ${d.over ? 'style="color:var(--bad);font-weight:600"' : ''}>${x.ab ? `Tausch ab ${x.max} ${h(x.einheit)}` : `Grenzwert ≤ ${x.max} ${h(x.einheit)}`}${d.over ? (x.ab ? ' erreicht, Melder tauschen (wird als Störung erfasst)' : ' überschritten, wird als Störung erfasst') : ''}</div>` : ''}</div>
    <div class="ctl">${ctl}</div>
    ${d.v==='nio' ? `<div class="mng">
      <textarea data-in="fm" ${attrs} placeholder="Bemerkung, z. B. was zu tun ist (optional)" aria-label="Bemerkung zu diesem Punkt" style="min-height:44px">${h(d.m||'')}</textarea>
      <span class="small">Wird beim Abschicken in <b>einer</b> Störung für diese Komponente zusammengefasst.</span>
    </div>` : ''}
  </div>`;
}
function stoerPunkte(A, c){
  const punkte = []; let abschnitt = '';
  const p = A.pr[c.id]; if(!p) return punkte;
  clFor(A,c).forEach(x => {
    if(x.typ==='ueberschrift'){ abschnitt = x.label; return; }
    const d = p.f[x.id]; if(!d) return;
    const wo = abschnitt ? `${abschnitt}: ${x.label}` : x.label;
    if(d.v==='nio') punkte.push(`• ${wo}${d.m ? ' – '+d.m.trim() : ''}`);
    if(d.over) punkte.push(`• ${wo}: ${d.v} ${x.einheit} (${x.ab ? `Tausch ab ${x.max} ${x.einheit} erforderlich` : `Grenzwert ${x.max} ${x.einheit} überschritten`})`);
  });
  return punkte;
}
const stoerTitel = punkte => punkte.length===1 ? punkte[0].replace(/^• /,'').split(' – ')[0] : `${punkte.length} Prüfpunkte nicht in Ordnung`;
function berichtSenden(A){
  clFesthalten(A);
  const ks = auftragKomps(A).filter(c => A.pr[c.id] && A.pr[c.id].done);
  if(!ks.length) return;
  const pruefTag = A.korrektur ? (A.abgeschlossen || iso(TODAY)) : iso(TODAY);
  if(!A.letzteVorher){ A.letzteVorher = {}; auftragKomps(A).forEach(c => A.letzteVorher[c.id] = c.letzte || null); }
  A.autoSt = [];
  ks.forEach(c => {
    // Alle n.i.O.-Punkte und überschrittenen Grenzwerte einer Komponente werden zu EINER Störung zusammengefasst
    const punkte = stoerPunkte(A, c);
    if(punkte.length){
      const liste = `Bei der Prüfung nicht in Ordnung:\n${punkte.join('\n')}`;
      const da = S.stoerungen.find(x => x.kompId===c.id && x.auftragNr===A.nr && x.status==='offen');
      if(da){ da.text = [da.text, liste].filter(Boolean).join('\n\n'); A.autoSt.push({id:da.id, zusatz:liste}); }
      else { const neu = {id:uid(), nr:S.nextStoerung++, auftragNr:A.nr, kompId:c.id,
        titel: stoerTitel(punkte),
        text:liste, schwere:'Mangel', status:'offen', datum:iso(TODAY), von:me().name};
        S.stoerungen.unshift(neu); A.autoSt.push({id:neu.id}); }
    }
    c.letzte = pruefTag;
  });
  A.status = 'erledigt'; A.abgeschlossen = pruefTag; A.erstGesendet = A.erstGesendet || iso(TODAY); A.korrekturFrei = false;
  if(A.korrektur) A.verlauf = (A.verlauf||[]).concat(`${fmt(iso(TODAY))} ${nowTime()}: ${me().name} hat die korrigierte Fassung ${A.korrektur} abgeschickt`);
  berichtAblegen(A, true);
  save();
}

/* Korrektur: Auftrag wieder öffnen, automatische Folgen des letzten Abschickens zurücknehmen */
function korrekturStarten(A){
  (A.autoSt||[]).forEach(x => {
    const st = by(S.stoerungen, x.id); if(!st) return;
    if(x.zusatz) st.text = st.text.replace('\n\n'+x.zusatz, '').replace(x.zusatz, '').trim();
    else if(st.status==='offen') S.stoerungen = S.stoerungen.filter(y => y.id!==st.id);
  });
  A.autoSt = [];
  Object.entries(A.letzteVorher||{}).forEach(([cid, v]) => { const c = by(S.komponenten, cid); if(c) c.letzte = v; });
  A.korrektur = (A.korrektur||0) + 1; A.status = 'laeuft'; A.korrekturFrei = false;
  A.verlauf = (A.verlauf||[]).concat(`${fmt(iso(TODAY))} ${nowTime()}: ${me().name} hat den Bericht zur Korrektur geöffnet`);
  save();
}

/* ---------- Import aus Foxtag (Excel/CSV, nur im Browser) ---------- */
async function readTable(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  if(buf[0]===0x50 && buf[1]===0x4b) return readXlsx(buf);
  return readCsv(new TextDecoder('utf-8').decode(buf));
}
async function readXlsx(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let e = buf.length-22; while(e > 0 && dv.getUint32(e,true)!==0x06054b50) e--;
  const n = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true); const files = {};
  for(let i=0; i<n; i++){
    const comp = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true), nl = dv.getUint16(p+28,true), el = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    files[new TextDecoder().decode(buf.subarray(p+46,p+46+nl))] = {comp, csize, off}; p += 46+nl+el+cl;
  }
  const read = async name => {
    const f = files[name]; if(!f) return null;
    const start = f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true), data = buf.slice(start, start+f.csize);
    if(f.comp===0) return new TextDecoder().decode(data);
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml = s => new DOMParser().parseFromString(s,'application/xml');
  const ss = await read('xl/sharedStrings.xml');
  const strings = ss ? [...xml(ss).getElementsByTagName('si')].map(si => si.textContent) : [];
  const sheet = Object.keys(files).filter(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
  if(!sheet) throw new Error('In der Excel-Datei wurde keine Tabelle gefunden.');
  const col = ref => { let c = 0; for(const ch of ref.replace(/\d+/g,'')) c = c*26 + ch.charCodeAt(0)-64; return c-1; };
  const grid = [...xml(await read(sheet)).getElementsByTagName('row')].map(r => {
    const out = [];
    [...r.getElementsByTagName('c')].forEach(c => { const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
      out[col(c.getAttribute('r'))] = t==='s' ? strings[+v.textContent] : t==='inlineStr' ? c.textContent : v ? v.textContent : ''; });
    return out;
  });
  return toObjects(grid);
}
function readCsv(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0], d = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0; i<text.length; i++){ const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch==='"') q = true;
    else if(ch===d){ row.push(cur); cur = ''; }
    else if(ch==='\n'){ row.push(cur.replace(/\r$/,'')); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if(cur || row.length){ row.push(cur); rows.push(row); }
  return toObjects(rows);
}
function toObjects(grid){
  const head = (grid[0]||[]).map(x => String(x||'').trim().toUpperCase());
  return grid.slice(1).map(r => { const o = {}; head.forEach((k,i) => o[k] = String(r[i] ?? '').trim()); return o; }).filter(o => Object.values(o).some(Boolean));
}
function toIso(v){
  if(!v) return null;
  let m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  if(/^\d{5}(\.\d+)?$/.test(v)) return new Date(Date.UTC(1899,11,30) + Math.floor(+v)*864e5).toISOString().slice(0,10);
  return null;
}
function importAnlagen(rows, kundenRows, replace){
  if(!rows.length || !('OBJEKT.NUMMER' in rows[0])) throw new Error('Das ist kein Anlagen- oder Objekte-Export aus Foxtag. Es fehlt die Spalte OBJEKT.NUMMER.');
  if(kundenRows && kundenRows.length && !('KUNDE.NUMMER' in kundenRows[0])) throw new Error('Die zweite Datei ist kein Kunden-Export aus Foxtag. Es fehlt die Spalte KUNDE.NUMMER.');
  if(replace){ S.kunden = []; S.objekte = []; S.anlagen = []; S.komponenten = []; S.auftraege = []; S.stoerungen = []; S.berichte = []; S.mails = []; }
  const kByNr = {}, oByNr = {};
  S.kunden.forEach(k => kByNr[k.nr] = k); S.objekte.forEach(o => oByNr[o.nr] = o);
  const kunde = (nr, name) => {
    nr = nr || 'OHNE-KUNDE';
    if(!kByNr[nr]){ kByNr[nr] = {id:'k'+uid(), nr, name: name || (nr==='OHNE-KUNDE' ? 'Ohne Kunde' : nr), adresse:'', ort:''}; S.kunden.push(kByNr[nr]); }
    else if(name && kByNr[nr].name===nr) kByNr[nr].name = name;
    return kByNr[nr];
  };
  (kundenRows||[]).forEach(r => {
    const k = kunde(r['KUNDE.NUMMER'], r['KUNDE.NAME']);
    k.adresse = [r['ADRESSZEILE1'], r['ADRESSZEILE2']].filter(Boolean).join(', ');
    k.ort = [r['PLZ'], r['STADT']].filter(Boolean).join(' ');
  });
  const get = (r, ...keys) => { for(const k of keys) if(r[k]) return r[k]; return ''; };
  rows.forEach(r => {
    const k = kunde(r['KUNDE.NUMMER'], r['KUNDE.NAME']);
    const key = r['OBJEKT.NUMMER'] || r['OBJEKT.NAME'];
    let o = oByNr[key];
    if(!o){
      o = oByNr[key] = {id:'o'+uid(), kundeId:k.id, nr:r['OBJEKT.NUMMER']||'', name:r['OBJEKT.NAME']||key,
        adresse:[get(r,'OBJEKT.ADRESSE.ZEILE1','OBJEKT.ADRESSZEILE1'), get(r,'OBJEKT.ADRESSE.ZEILE2','OBJEKT.ADRESSZEILE2')].filter(Boolean).join(', '),
        ort:[get(r,'OBJEKT.ADRESSE.PLZ','OBJEKT.PLZ'), get(r,'OBJEKT.ADRESSE.STADT','OBJEKT.STADT')].filter(Boolean).join(' ')};
      S.objekte.push(o);
    }
    if('ANLAGE.NAME' in r || 'ANLAGE.WARTUNGSANWENDUNG' in r)
      S.anlagen.push({id:'a'+uid(), objektId:o.id, name:r['ANLAGE.NAME'] || r['ANLAGE.WARTUNGSANWENDUNG'] || 'Wartung', hinweis:r['ANLAGE.HINWEISE']||'', techName:r['ANLAGE.TECHNIKER.NAME']||''});
  });
  S.objekte.forEach(o => { if(!S.anlagen.some(a => a.objektId===o.id)) S.anlagen.push({id:'a'+uid(), objektId:o.id, name:'Wartung', hinweis:''}); });
  return {kunden:S.kunden.length, objekte:S.objekte.length, anlagen:S.anlagen.length};
}
function importKomponenten(aid, rows){
  if(!rows.length || !('GRUPPE.NUMMER' in rows[0])) throw new Error('Das ist kein Komponenten-Export aus Foxtag. Es fehlt die Spalte GRUPPE.NUMMER.');
  S.komponenten = S.komponenten.filter(c => c.anlageId!==aid);
  S.gruppen = S.gruppen || {};
  rows.forEach(r => {
    const g = parseInt(r['GRUPPE.NUMMER'],10) || 6;
    if(r['GRUPPE.NAME'] && r['GRUPPE.NAME']!==GRUPPEN[g]) S.gruppen[g] = r['GRUPPE.NAME'];
    const name = r['TYP.NAME'] || r['GRUPPE.NAME'] || 'Komponente';
    const code = ((r['TYP.HERSTELLER']+' '+r['TYP.MODELL']).match(/\[([VHJZ])\]/)||[])[1] || '';
    let t = S.typen.find(x => tname(x)===name && (x.code||'')===code);
    if(!t){
      const cl = S.checklisten.find(c => name.toLowerCase().startsWith(c.name.toLowerCase())) || by(S.checklisten,'cl-sonst') || S.checklisten[0];
      t = {id:'t'+uid(), gruppe:g, name, code, intervall: code ? CODES[code][1] : 12, checklisteId:cl.id};
      if(/rauchmelder/i.test(name)) t.ersatzJahre = 8;
      S.typen.push(t);
    }
    const hm = [r['TYP.HERSTELLER'], r['TYP.MODELL']].filter(x => x && !/^\[.\]$/.test(x)).join(' | ');
    S.komponenten.push({id:'c'+uid(), anlageId:aid, gruppe:g, nr:parseInt(r['NUMMER'],10)||1, sub:parseInt(r['SUB-NUMMER'],10)||0, typId:t.id,
      standort:r['STANDORT'] || hm, sn:r['SERIENNUMMER']||'', baujahr:r['BAUJAHR']||'', letzte:toIso(r['LETZTE_PRÜFUNG'])});
  });
  return rows.length;
}

async function datenEntschluesseln(user, pw){
  const buf = new Uint8Array(await (await fetch('daten.bin', {cache:'no-cache'})).arrayBuffer());
  if(String.fromCharCode(...buf.slice(0,4))!=='GMW1') throw new Error('Die Datendatei ist beschädigt.');
  const salt = buf.slice(4,20), iv = buf.slice(20,36), mac = buf.slice(36,68), ct = buf.slice(68);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user.trim().toLowerCase()+'|'+pw), 'PBKDF2', false, ['deriveBits']);

  const hk = await crypto.subtle.importKey('raw', bits.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const signiert = new Uint8Array(iv.length + ct.length); signiert.set(iv); signiert.set(ct, iv.length);
  if(!await crypto.subtle.verify('HMAC', hk, mac, signiert)) return null;
  const ak = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-CBC', iv}, ak, ct);
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}

    const B = await datenEntschluesseln(user, pw);
    if(!B){ UI.loginErr = 'Benutzer oder Passwort ist falsch.'; btn.disabled = false; btn.textContent = 'Anmelden'; err.textContent = UI.loginErr; return; }
    importBundle(B, true);
    S.daten = DATEN_STAND; UI.loginErr = ''; UI.view = 'start';
    await saveNow(); render(); toast('Angemeldet. Alle Kunden und Anlagen sind geladen.');
  }catch(e){ btn.disabled = false; btn.textContent = 'Anmelden'; err.textContent = e.message || 'Die Daten konnten nicht geladen werden.'; }
}
function importBundle(B, replace){
  if(!B || B.format!=='gm-foxtag-bundle') throw new Error('Das ist keine Foxtag-Gesamtdatei.');
  if(replace){ S.kunden = []; S.objekte = []; S.anlagen = []; S.komponenten = []; S.auftraege = []; S.stoerungen = []; S.berichte = []; S.mails = []; }
  const kByNr = {}; S.kunden.forEach(k => kByNr[k.nr] = k);
  const kunde = (nr, name) => {
    nr = nr || 'OHNE-KUNDE';
    if(!kByNr[nr]){ kByNr[nr] = {id:'k'+uid(), nr, name: name || (nr==='OHNE-KUNDE' ? 'Ohne Kunde' : nr), adresse:'', ort:''}; S.kunden.push(kByNr[nr]); }
    return kByNr[nr];
  };
  B.kunden.forEach(r => Object.assign(kunde(r.nr, r.name), {name:r.name || r.nr, adresse:r.adresse||'', ort:r.ort||''}));
  const oByKey = {}, aByKey = {};
  B.objekte.forEach(r => { const k = kunde(r.kundeNr, r.kundeName); const o = {id:'o'+uid(), kundeId:k.id, nr:r.nr||'', name:r.name||'', adresse:r.adresse||'', ort:r.ort||'', lat:r.lat ?? null, lng:r.lng ?? null}; if(o.lat==null) delete o.lat, delete o.lng; S.objekte.push(o); oByKey[r.key] = o; });
  B.anlagen.forEach(r => { const o = oByKey[r.objektKey]; if(!o) return; const a = {id:'a'+uid(), objektId:o.id, name:r.name||'Wartung', hinweis:r.hinweis||'', techName:r.techName||''}; S.anlagen.push(a); aByKey[r.key] = a; });
  S.objekte.forEach(o => { if(!S.anlagen.some(a => a.objektId===o.id)) S.anlagen.push({id:'a'+uid(), objektId:o.id, name:'Wartung', hinweis:''}); });
  S.gruppen = S.gruppen || {};
  B.komponenten.forEach(r => {
    const a = aByKey[r.anlageKey]; if(!a) return;
    const g = +r.gruppe || 6;
    if(r.gruppeName && r.gruppeName!==GRUPPEN[g]) S.gruppen[g] = r.gruppeName;
    const name = r.typName || r.gruppeName || 'Komponente', code = r.code || '';
    let t = S.typen.find(x => tname(x)===name && (x.code||'')===code);
    if(!t){
      const cl = S.checklisten.find(c => name.toLowerCase().startsWith(c.name.toLowerCase())) || by(S.checklisten,'cl-sonst') || S.checklisten[0];
      t = {id:'t'+uid(), gruppe:g, name, code, intervall: code ? CODES[code][1] : 12, checklisteId:cl.id};
      if(/rauchmelder/i.test(name)) t.ersatzJahre = 8;
      S.typen.push(t);
    }
    S.komponenten.push({id:'c'+uid(), anlageId:a.id, gruppe:g, nr:+r.nr||1, sub:+r.sub||0, typId:t.id,
      standort:r.standort || [r.hersteller, r.modell].filter(Boolean).join(' | '), sn:r.sn||'', baujahr:r.baujahr ? String(r.baujahr) : '',
      letzte: r.naechste ? addMonths(r.naechste, -t.intervall) : null});
  });
  return {kunden:S.kunden.length, objekte:S.objekte.length, anlagen:S.anlagen.length, komponenten:S.komponenten.length};
}

    <form data-form="import" style="display:grid;gap:12px">

    </form>`);

  if(e.target.dataset.m==='k'){ if(e.target.value!=='neu') UI.neuK = e.target.value; neuObjektModal(e.target.value==='neu'); }
  if(e.target.id==='pa'){ const kt = (by(S.anlagen, e.target.value)||{}).kontakt || {}; document.getElementById('kpn').value = kt.name || ''; document.getElementById('kpt').value = kt.tel || ''; }
