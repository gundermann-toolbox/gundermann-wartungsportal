modal.addEventListener('submit', e => {
  e.preventDefault(); const f = new FormData(e.target), kind = e.target.dataset.form;
  if(kind==='import'){
    const err = document.getElementById('imErr'); err.textContent = 'Wird eingelesen …';
    (async () => {
      try{
        const file = f.get('anl'); let r;
        if(!file || !file.size) throw new Error('Bitte eine Datei auswählen.');
        // Am Handy ändern manche Apps den Dateinamen, deshalb am Inhalt erkennen statt an der Endung
        const kopf = new TextDecoder().decode(new Uint8Array(await file.slice(0, 64).arrayBuffer())).replace(/^﻿/, '').trim();
        if(kopf.startsWith('{')){
          let B; try{ B = JSON.parse((await file.text()).replace(/^﻿/, '')); }catch(x){ throw new Error('Die JSON-Datei ist beschädigt oder unvollständig. Bitte erneut herunterladen.'); }
          r = importBundle(B, !!f.get('replace'));
        } else {
          const rows = await readTable(file);
          const kf = f.get('kun'), krows = kf && kf.size ? await readTable(kf) : null;
          r = importAnlagen(rows, krows, !!f.get('replace'));
        }
        const ok = await saveNow();
        closeModal(); UI.view = 'kunden'; UI.q = ''; render();
        toast(`${r.kunden} Kunden, ${r.objekte} Objekte, ${r.anlagen} Anlagen${r.komponenten!=null ? ', '+r.komponenten+' Komponenten' : ''} importiert` + (ok ? '' : '. Achtung: zu groß für den Browserspeicher, nach dem Neuladen weg'));
      }catch(ex){ err.textContent = ex.message || 'Die Datei konnte nicht gelesen werden.'; }
    })();
  }
  if(kind==='planen'){
    const aid = f.get('anlage'), umfang = f.get('umfang');
    const ks = kompsOf(aid).filter(c => umfang==='ganz' || ['bad','warn'].includes(st(c).cls) || !c.letzte);
    const techs = f.getAll('tech');
    const A = {id:uid(), nr:'A-'+(S.nextAuftrag++), anlageId:aid, datum:f.get('datum'), zeit:f.get('zeit')||'', techIds:techs, status: techs.length && f.get('frei') ? 'geplant' : 'planung', umfang, kompIds:ks.map(c => c.id), pr:{}, bem:'', kunde:'', sigTech:null, sigKunde:null, ansp:(f.get('ansp')||'').trim(), tel:(f.get('tel')||'').trim()};
    kontaktMerken(A);
    S.auftraege.push(A); save(); closeModal(); UI.view = 'auftrag'; UI.auftrag = A.id; render(); window.scrollTo(0,0);
    toast(A.status==='geplant' ? `Auftrag ${A.nr} liegt jetzt in der App bei ${techNames(techs)}` : `Auftrag ${A.nr} angelegt, noch nicht freigegeben`);
  }
  if(kind==='stoer'){
    const st = UI.stoer || {}, titel = String(f.get('titel')||'').trim(); if(!titel) return;
    if(st.id){
      const x = by(S.stoerungen, st.id); if(!x) return closeModal();
      Object.assign(x, {titel, text:String(f.get('text')||'').trim(), schwere:f.get('schwere'), status:f.get('status') || x.status});
      save(); closeModal(); render(); toast(`Störung #${x.nr} gespeichert`);
    } else {
      const x = {id:uid(), nr:S.nextStoerung++, auftragNr:st.auftragNr, kompId:st.kompId, titel, text:String(f.get('text')||'').trim(), schwere:f.get('schwere'), status:'offen', datum:iso(TODAY), von:me().name};
      S.stoerungen.unshift(x); save(); closeModal(); render(); toast(`Störung #${x.nr} angelegt`);
    }
  }
  if(kind==='kontakt'){
    const a = by(S.anlagen, UI.ktEdit); if(!a) return closeModal();
    const name = (f.get('ansp')||'').trim(), tel = (f.get('tel')||'').trim();
    a.kontakt = (name || tel) ? {name, tel} : null;
    save(); closeModal(); render(); toast('Ansprechpartner gespeichert');
  }
  if(kind==='kedit'){
    const c = by(S.komponenten, UI.kEdit); if(!c) return closeModal();
    const g = parseInt(f.get('gruppe'),10) || c.gruppe, nr = parseInt(f.get('nr'),10) || c.nr, sub = parseInt(f.get('sub'),10) || 0;
    if(S.komponenten.some(x => x!==c && !x.entfernt && x.anlageId===c.anlageId && x.gruppe===g && x.nr===nr && (x.sub||0)===sub)){ toast(`Nummer ${g}.${nr}${sub ? '.'+sub : ''} ist in dieser Anlage schon vergeben`); return; }
    Object.assign(c, {typId:f.get('typ'), gruppe:g, nr, sub, standort:f.get('standort')||'', sn:f.get('sn')||'', baujahr:f.get('baujahr')||'', letzte:f.get('letzte')||null});
    save(); closeModal(); render(); toast(`Komponente ${kNr(c)} gespeichert`);
  }
  if(kind==='aedit'){
    const A = curA(), techs = f.getAll('tech');
    A.datum = f.get('datum'); A.zeit = f.get('zeit') || ''; A.techIds = techs;
    A.ansp = (f.get('ansp')||'').trim(); A.tel = (f.get('tel')||'').trim(); kontaktMerken(A);
    if(!techs.length && A.status!=='planung') A.status = 'planung';
    save(); closeModal(); render();
    toast(techs.length ? `Auftrag ${A.nr} gespeichert` : `Auftrag ${A.nr} ohne Techniker, zurück auf „In Planung“`);
  }
  if(kind==='neuobjekt'){
    let kid = f.get('k');
    if(kid==='neu'){ kid = 'k'+uid(); S.kunden.push({id:kid, nr:f.get('knr'), name:f.get('kname'), adresse:f.get('kadr')||'', ort:f.get('kort')||''}); }
    const k = by(S.kunden,kid);
    const oid = 'o'+uid(); S.objekte.push({id:oid, kundeId:kid, nr:f.get('onr'), name:f.get('oname'), adresse:f.get('oadr')||k.adresse, ort:f.get('oort')||k.ort});
    const aid = 'a'+uid(); S.anlagen.push({id:aid, objektId:oid, name:'Wartung', hinweis:''});
    save(); closeModal(); UI.view = 'anlage'; UI.anlage = aid; UI.addK = true; render(); toast('Objekt angelegt. Jetzt Komponenten hinzufügen.');
  }
});

function addFoto(file, cid){
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => {
    const sc = Math.min(1, 900/Math.max(img.width,img.height)); const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    prOf(curA(),cid).fotos.push(cv.toDataURL('image/jpeg',.72)); save(); render();
  }; img.src = fr.result; };
  fr.readAsDataURL(file);
}
function initSig(cv){
  const A = curA(); if(!A) return;
  const key = cv.dataset.sig, r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(!r.width) return;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const c = cv.getContext('2d'); c.scale(dpr,dpr);
  const lw = cv.closest('#sigvoll') ? 4.2 : 3.4; // kräftiger Strich, im Vollbild etwas dicker
  c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper-ink').trim() || '#1a1f24';
  if(A[key]){ const img = new Image(); img.onload = () => {
    // Unterschrift unverzerrt einpassen (z. B. nach Vollbild im Querformat)
    const w = img.width, hh = img.height, f = Math.min(r.width*dpr/w, r.height*dpr/hh) / dpr;
    c.drawImage(img, 0, 0, w*f, hh*f); }; img.src = A[key]; }
  let down = false, last = null;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  cv.onpointerdown = e => { down = true; last = pt(e); cv.setPointerCapture(e.pointerId); c.beginPath(); c.arc(last[0],last[1],lw/2,0,7); c.fill(); };
  cv.onpointermove = e => { if(!down) return; const p = pt(e); c.beginPath(); c.moveTo(last[0],last[1]); c.lineTo(p[0],p[1]); c.stroke(); last = p; };
  cv.onpointerup = cv.onpointercancel = () => { if(!down) return; down = false; A[key] = cv.toDataURL('image/png'); if(key==='sigTech') A.sigName = me().name; save(); };
}

  document.body.appendChild(el);
  const cv = el.querySelector('canvas');
  const neu = () => setTimeout(() => initSig(cv), 120);
  const zu = () => {
    removeEventListener('resize', neu); document.removeEventListener('fullscreenchange', beiVollbild);
    try{ screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); }catch(e){}
    if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
    el.remove(); render();

    if(b.dataset.sv==='loeschen'){ A.sigTech = null; save(); initSig(cv); } else zu(); });
  addEventListener('resize', neu);

  start.then(() => { document.addEventListener('fullscreenchange', beiVollbild);

function gSuche(q){
  q = q.trim().toLowerCase();
  if(q.length < 2) return '';
  const treffer = [];
  S.kunden.filter(k => [k.nr, k.name, k.ort].join(' ').toLowerCase().includes(q) && S.objekte.some(o => o.kundeId===k.id)).slice(0,5)
    .forEach(k => treffer.push(`<button class="gitem" data-act="kunde" data-id="${k.id}"><span class="art">Kunde</span><b>${h(kName(k))}</b><small>${h(k.nr)} · ${h(k.ort)}</small></button>`));
  S.objekte.filter(o => [o.nr, o.name, o.adresse, o.ort].join(' ').toLowerCase().includes(q)).slice(0,6).forEach(o => {
    const a = S.anlagen.find(x => x.objektId===o.id); if(!a) return;
    treffer.push(`<button class="gitem" data-act="anlage" data-id="${a.id}"><span class="art">Objekt</span><b>${h(o.nr)} ${h(o.name)}</b><small>${h(o.adresse)}, ${h(o.ort)}</small></button>`); });
  S.auftraege.filter(a => a.nr.toLowerCase().includes(q)).slice(0,4).forEach(a => { const {o} = ctx(a.anlageId);
    treffer.push(`<button class="gitem" data-act="auftrag" data-id="${a.id}"><span class="art">Auftrag</span><b>${h(a.nr)} · ${h(statusLabel(a.status))}</b><small>${h(o.name)} · ${aDatum(a)}</small></button>`); });
  S.stoerungen.filter(x => ('#'+x.nr+' '+x.titel).toLowerCase().includes(q)).slice(0,3).forEach(x =>
    treffer.push(`<button class="gitem" data-act="gstoer"><span class="art">Störung</span><b>#${x.nr} ${h(x.titel)}</b><small>${h(x.status)}</small></button>`));

/* Weicher Übergang, wenn sich die Ansicht ändert (nicht bei jedem Tastendruck) */
let letzteAnsicht = null;
const APP_TIEFE = {liste:0, neu:1, auftrag:1, komp:2, abschluss:3, vorschau:4, gesendet:4};
function uebergang(){
  const key = S.mode==='app' ? 'app|'+UI.app.screen+'|'+(UI.app.komp||'') : 'web|'+UI.view+'|'+(UI.anlage||'')+'|'+(UI.auftrag||'')+'|'+(UI.kunde||'');
  if(key===letzteAnsicht) return;
  const vorher = letzteAnsicht; letzteAnsicht = key;
  if(!vorher) return;
  let art = 'v-ein';
  if(S.mode==='app' && vorher.startsWith('app|')){
    const a = APP_TIEFE[vorher.split('|')[1]] ?? 0, b = APP_TIEFE[UI.app.screen] ?? 0;
    art = b > a ? 'v-rechts' : b < a ? 'v-links' : 'v-ein';
  }
  app.classList.remove('v-ein','v-rechts','v-links'); void app.offsetWidth; app.classList.add(art);
}
app.addEventListener('animationend', () => app.classList.remove('v-ein','v-rechts','v-links'));
app.innerHTML = '<div class="empty">Daten werden geladen …</div>';
/* App installieren und offline nutzen (nur auf der echten Seite, nicht in der Claude-Vorschau) */
let installHinweis = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installHinweis = e; document.getElementById('installBtn').hidden = false; });
addEventListener('appinstalled', () => { installHinweis = null; document.getElementById('installBtn').hidden = true; });
const offlineAnzeigen = () => { document.getElementById('offline').hidden = navigator.onLine; };
addEventListener('online', () => { offlineAnzeigen(); toast('Wieder online'); });
addEventListener('offline', () => { offlineAnzeigen(); toast('Offline: Du kannst weiterarbeiten, alles wird auf dem Gerät gespeichert.'); });
offlineAnzeigen();
if('serviceWorker' in navigator && /github\.io$|^localhost$/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
Promise.all([load(), datenPruefen()]).then(render).catch(e => {
  app.innerHTML = `<section class="panel" style="max-width:640px"><h2>Die Seite konnte nicht geladen werden</h2>
    <p style="margin:0">Fehler: <span class="mono">${h(e && e.message || e)}</span></p><p class="muted small" style="margin:0">Bitte diese Meldung an Marcel weitergeben.</p>
    <div><button class="btn pri" onclick="location.reload()">Seite neu laden</button></div></section>`;
});
</script>
</body>
</html>
